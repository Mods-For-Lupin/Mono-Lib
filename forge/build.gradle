plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
}

mixin {
    add(sourceSets.main, "${mod_id}.refmap.json")

    config("${mod_id}.mixins.json")
    config("${mod_id}.forge.mixins.json")
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    validateAccessTransformers = true

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        client {
            client()
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    compileOnly project(":common")
    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")

    // curios (dependency for Ender Pack)
    modImplementation "curse.maven:curios-309927:6418456"
    modImplementation "curse.maven:enderpack-959446:6200716"

    modImplementation "curse.maven:unlocked-typing-1373339:7206217"
    modImplementation "curse.maven:golden-foods-873866:5860674"
    modImplementation "curse.maven:more-beautiful-torches-860325:5263631"
    modImplementation "curse.maven:longer-following-time-1148090:6952683"
    modImplementation "curse.maven:automessage-868624:6661952"
    modImplementation "curse.maven:blowguns-1296310:6721763"
